<!doctype html>
<html lang="en" data-edit><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Edit · Yicheng Chen</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="site.css">
<script src="content.js"></script>
<script src="settings.js"></script>
<script src="site.js"></script>
<!-- The text editor of the site. It shows your page as it is and lets you change it in place; nothing changes online until you
     download content.js and upload it. Keep this file in the Dropbox folder next to the site files; it does not need to go to GitHub.
     One style logic, taken from the site: the site's type (Crimson Pro), its link blue, heading navy, two text greys and hairline
     colour; every size and gap a multiple of a quarter line (6 px). One button shape everywhere: small, outlined in blue; filled blue
     only for the two actions that finish something (Done, Download content.js). -->
<style>
:root{--eb:#2b2b82;--en:#1f1f5c;--et:#4a4a4a;--em:#707070;--el:#e4e4ec;--etint:#f5f5fa;--eh:48px;--ef:"Crimson Pro",Georgia,serif}
html[data-edit] body{border-top:var(--eh) solid transparent}
/* top bar */
#edbar{position:fixed;top:0;left:0;right:0;z-index:30;min-height:var(--eh);display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:6px 24px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--el);font:15px/24px var(--ef);color:var(--et);box-sizing:border-box}
#edbar .t{font:600 13px/18px var(--ef);letter-spacing:.09em;text-transform:uppercase;color:var(--en)}
#edbar .st{font-size:14px;color:var(--em)}
#edbar .st i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--eb);margin-right:7px;vertical-align:1px}
#edbar .sp{flex:1}
#edbar .acts{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
/* one button shape */
.eb{font:15px/22px var(--ef);color:var(--eb);background:#fff;border:1px solid #2b2b8259;border-radius:4px;padding:2px 12px;cursor:pointer;white-space:nowrap}
.eb:hover{border-color:var(--eb)}
.eb:focus-visible{outline:2px solid #2b2b8240;outline-offset:1px}
.eb.pri{background:var(--eb);border-color:var(--eb);color:#fff;font-weight:600}
.eb.pri:hover{background:#23236c}
.eb.sm{font-size:13px;line-height:18px;padding:1px 8px}
.eb.txt{border-color:transparent;background:none;color:var(--em);padding-left:2px;padding-right:2px}
.eb.txt:hover{color:var(--eb);border-color:transparent}
.eb:disabled{opacity:.4;cursor:default;border-color:#2b2b8259}
/* how to publish */
#edhelp{position:fixed;top:calc(var(--eh) + 6px);right:24px;z-index:31;width:min(400px,calc(100vw - 32px));padding:18px 18px 12px;background:#fff;border:1px solid var(--el);
  border-radius:8px;box-shadow:0 1px 2px rgba(31,31,92,.05),0 12px 32px rgba(31,31,92,.10);font:15px/22px var(--ef);color:var(--et);box-sizing:border-box}
#edhelp ol{margin:0 0 12px;padding-left:20px}#edhelp li{margin-bottom:6px}
/* editable parts of the page: a quiet tint on hover, a small Edit button beside them */
.ed-blk{position:relative;border-radius:6px;cursor:pointer;transition:background-color .15s,box-shadow .15s}
.ed-blk:hover{background:var(--etint);box-shadow:0 0 0 9px var(--etint)}
.ed-blk a,.ed-blk .abs-btn{cursor:pointer}
/* the Edit button sits beside the part when the window has room on the right, otherwise just above its right end */
.ed-chip{position:absolute;right:0;bottom:100%;margin-bottom:6px;display:flex;gap:4px;opacity:0;transition:opacity .15s;z-index:5;
  font:400 13px/18px var(--ef);letter-spacing:0;text-transform:none;font-style:normal;white-space:nowrap}
.ed-chip.out{left:100%;right:auto;bottom:auto;top:-2px;margin:0 0 0 18px}
.ed-blk:hover>.ed-chip,.ed-chip:focus-within{opacity:1}
/* on touch screens a tap on a part opens it; the arrows and Remove are in its fields */
@media (hover:none){.ed-chip{display:none}}
/* fields, opened in place */
.ed-form{margin:0 0 var(--pg);padding:18px 18px 12px;background:#fff;border:1px solid var(--el);border-radius:8px;text-align:left;cursor:auto;
  box-shadow:0 1px 2px rgba(31,31,92,.05),0 12px 32px rgba(31,31,92,.08);font:400 16px/24px var(--ef);color:var(--et);letter-spacing:0;text-transform:none;font-style:normal}
.side .ed-form{margin:0;width:100%}
.ed-form .lab{font:600 13px/18px var(--ef);letter-spacing:.09em;text-transform:uppercase;color:var(--en);margin:0 0 12px}
.ed-f{display:block;margin:0 0 12px}
.ed-f>span{display:block;font-size:14px;line-height:20px;color:var(--em);margin-bottom:4px}
.ed-f>span small{font-size:13px;color:#9898a6;margin-left:6px}
.ed-f input,.ed-f textarea{display:block;width:100%;box-sizing:border-box;font:16px/24px var(--ef);color:var(--et);background:#fff;border:1px solid var(--el);border-radius:4px;padding:5px 9px;outline:none}
.ed-f textarea{resize:vertical}
.ed-f input:focus,.ed-f textarea:focus{border-color:var(--eb);box-shadow:0 0 0 3px #2b2b821f}
.ed-two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.side .ed-two{grid-template-columns:1fr}
.ed-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 6px}
.ed-row .sp{flex:1}
.ed-msg{font-size:14px;color:var(--eb);margin:0 0 12px}
.ed-note{font-size:14px;line-height:20px;color:var(--em);margin:0 0 12px}
.ed-add{margin:0 0 var(--pg);display:flex;gap:8px}
.ed-add .eb::before{content:"+ "}
.ed-flash{animation:edflash .6s}
@keyframes edflash{0%,100%{box-shadow:0 0 0 0 #2b2b8200}40%{box-shadow:0 0 0 4px #2b2b8233}}
@media (max-width:700px){#edbar{padding:6px 14px;gap:2px 10px}#edbar .hide-s,#edbar .sp{display:none}#edbar .st{font-size:13px}.ed-two{grid-template-columns:1fr}.ed-form{padding:12px 12px 6px}}
</style></head>
<body data-page="home">
<noscript><p style="font:17px/1.5 Georgia,serif;margin:48px 24px">The editor needs JavaScript.</p></noscript>
<script>
(()=>{
const E=window.SiteEngine,$=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o)),
  esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const OK=typeof PAGES==='object'&&PAGES&&typeof SITE==='object'&&SITE;
const SAVED={site:E.cleanSite(OK?SITE:{}),pages:clone(OK?PAGES:{})},BASE=JSON.stringify(SAVED),KEY='yc-edit-draft';
// your changes are kept in this browser until the files change, so the page can be closed and opened again
let cur=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.base===BASE&&d.site&&d.pages)return{site:E.cleanSite(d.site),pages:d.pages}}catch(e){}return clone(SAVED)})();
const hist=[];let form=null,dlState=null;
const homeF=()=>cur.site.menu[0][1],resF=()=>(cur.site.menu[1]||cur.site.menu[0])[1],
  slug=u=>{let f=u.split('/').pop()||'index.html';return f.replace(/\.html?$/,'')};

// ---------- the text, read into fields and written back in the same form, so content.js stays readable ----------
const linkRe=/\[([^\]]+)\]\(([^)\s]+)\)/g,only=/^(\[[^\]]+\]\([^)\s]+\)\s*)+$/,
  splitLink=x=>{const i=x.indexOf('|');return i<0?[x.trim(),'']:[x.slice(0,i).trim(),x.slice(i+1).trim()]};
function parseProfile(t){const lines=[],links=[];let email='',cv='',cvLabel='Curriculum Vitae';
  for(const l of t.replace(/\r/g,'').split('\n').map(x=>x.trim())){if(!l)continue;const m=l.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/);
    if(!m)lines.push(l);else if(!email&&/^mailto:/i.test(m[2]))email=m[2].slice(7);else if(!cv&&/\bcv\b|vitae|resume/i.test(m[1])){cv=m[2];cvLabel=m[1]}else links.push([m[1],m[2]])}
  return{lines,email,cv,cvLabel,links}}
function buildProfile(p){const L=[];if(p.email)L.push(`[${p.email}](mailto:${p.email})`);if(p.cv)L.push(`[${p.cvLabel||'Curriculum Vitae'}](${p.cv})`);p.links.forEach(([a,b])=>L.push(`[${a}](${b})`));
  return p.lines.map(x=>x.trim()).filter(Boolean).join('\n')+(L.length?'\n\n'+L.join('\n'):'')}
function splitHome(t){const head=[],body=[];for(const l of t.replace(/\r/g,'').split('\n'))(/^#\s|^!\[|^footer:/i.test(l.trim())?head:body).push(l.trim()?l:'');return{head:head.map(x=>x.trim()),body:body.join('\n').trim()}}
const joinHome=h=>h.head.join('\n')+(h.body.trim()?'\n\n'+h.body.trim():'');
function parsePapers(t){const out={title:'',sections:[]};let sec=null;
  for(const b of t.replace(/\r/g,'').split(/\n\s*\n/).map(x=>x.split('\n').map(y=>y.trim()).filter(Boolean)).filter(x=>x.length)){let i=0;
    while(i<b.length&&/^##?\s/.test(b[i])){if(b[i].startsWith('# '))out.title=b[i].slice(2).trim();else{sec={name:b[i].slice(3).trim(),items:[]};out.sections.push(sec)}i++}
    const r=b.slice(i);if(!r.length)continue;if(!sec){sec={name:'',items:[]};out.sections.push(sec)}
    if(!r[0].startsWith('### ')){sec.items.push({note:r.join('\n')});continue}
    const p={title:r[0].slice(4).trim(),authors:'',status:'',links:'',abstract:''},meta=[];
    for(const l of r.slice(1)){if(l.startsWith('>'))p.abstract+=(p.abstract?' ':'')+l.slice(1).trim();else if(only.test(l))p.links+=(p.links?'\n':'')+[...l.matchAll(linkRe)].map(m=>m[1]+' | '+m[2]).join('\n');else meta.push(l)}
    const w=meta.findIndex(l=>/^with\b/i.test(l));if(w>=0)p.authors=meta.splice(w,1)[0];p.status=meta.join('\n');sec.items.push(p)}
  return out}
function buildPapers(m){const out=[];if(m.title)out.push('# '+m.title);
  for(const s of m.sections){if(s.name.trim())out.push('## '+s.name.trim());
    for(const p of s.items){if(p.note!==undefined){out.push(p.note);continue}if(!p.title.trim())continue;const L=['### '+p.title.trim()];if(p.authors.trim())L.push(p.authors.trim());
      p.status.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>L.push(x));
      const ln=p.links.split('\n').map(splitLink).filter(x=>x[0]&&x[1]).map(([a,b])=>`[${a}](${b})`).join(' ');if(ln)L.push(ln);
      const ab=p.abstract.replace(/\s+/g,' ').trim();if(ab)L.push('> '+ab);out.push(L.join('\n'))}}
  return out.join('\n\n')}
const q=s=>"'"+s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')+"'",bt=s=>'`'+s.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$\{/g,'\\${')+'`',
  pad=(s,n=34)=>s.length>=n?s+' ':s+' '.repeat(n-s.length);
function contentText(){const si=cur.site;
  return`// Yicheng Chen website: the text of the page, the name and the contacts.
// The easiest way to change it: open edit.html (in the Dropbox folder), change the text on the page, press "Download content.js",
// and replace this file with it. Or change the words between the back-quotes here; keep the back-quotes and commas.
//
//   # Research                  title of a part
//   ## Working Papers           a list of papers
//   (empty line)                new paragraph
//   [text](https://link)        link; outside links open in a new tab
//   ![Yicheng Chen](photo.jpg)  the photo, with its description for screen readers
//   a paper:                    ### title
//                               lines such as "with Coauthor Name" or "Revise and Resubmit, Journal"
//                               a line of links such as [Draft](link) [SSRN](link)
//                               a line starting with > holds the abstract (optional; without it there is no Abstract button)
//
// The page has two parts, both on index.html: 'index.html' below is the top (About) and 'research.html' the Research part.

const SITE={
${pad(`  name:${q(si.name)},`)}// at the top of the profile column and in the tab
  menu:[${si.menu.map(([t,u])=>`[${q(t)},${q(u)}]`).join(',')}],   // [label, part]; the first is the top of the page
${pad(`  photo:${q(si.photo)},`)}// photo in the profile column
${pad(`  about:${q(si.about)},`)}// heading of the first part
  // profile column: position lines, an empty line, then the links (email, CV, others)
  sidebar:${bt(si.sidebar)}
};

const PAGES={
${Object.entries(cur.pages).map(([k,v])=>`${q(k)}:${bt(v)}`).join(',\n\n')}
};
`}

// ---------- state ----------
const changed=()=>JSON.stringify({site:cur.site,pages:cur.pages})!==BASE;
function save(){try{localStorage.setItem(KEY,JSON.stringify({site:cur.site,pages:cur.pages,base:BASE}))}catch(e){}bar()}
function commit(fn){const before=JSON.stringify(cur);hist.push(clone(cur));fn();if(JSON.stringify(cur)===before)hist.pop();save();redraw()}
function redraw(){form=null;E.draw(cur.site,cur.pages);decorate();bar()}

// ---------- top bar ----------
document.body.insertAdjacentHTML('beforeend',`<div id="edbar" data-ed><span class="t">Edit site</span><span class="st" id="edst"></span><span class="sp"></span>
  <span class="acts"><button type="button" class="eb" id="edundo" title="Undo the last change (Ctrl+Z)">Undo</button><button type="button" class="eb hide-s" id="edopen" title="Open the page in a new tab with your changes">Open page ↗</button>
  <button type="button" class="eb pri" id="eddl">Download content.js</button><button type="button" class="eb txt" id="edhow">How to publish</button></span></div>
  <div id="edhelp" data-ed hidden><p class="lab" style="font:600 13px/18px var(--ef);letter-spacing:.09em;text-transform:uppercase;color:var(--en);margin:0 0 12px">To publish your changes</p>
  <ol><li>Press <b>Download content.js</b>.</li><li>Put the file in <b>Dropbox\\Project\\Site\\Assets</b>, replacing the old content.js.</li>
  <li>On github.com, open your site's repository: <b>Add file</b> › <b>Upload files</b>, drop in content.js, press <b>Commit changes</b>. The site shows it in about a minute.</li></ol>
  <p class="ed-note">Until then your changes stay in this browser, also after closing this page.</p>
  <div class="ed-row"><button type="button" class="eb" id="edclose">Close</button><span class="sp"></span><button type="button" class="eb txt" id="edreset">Discard all changes</button></div></div>`);
function bar(){const st=$('#edst'),c=changed(),s=JSON.stringify(cur);
  st.innerHTML=!OK?'content.js could not be read; nothing can be saved':!c?'No changes · click any part of the page to edit it':dlState===s?'Downloaded · now replace content.js in the folder and upload it':'<i></i>Changed · not downloaded yet';
  $('#edundo').disabled=!hist.length;$('#eddl').disabled=!OK}
$('#edundo').onclick=()=>{if(!hist.length)return;cur=hist.pop();save();redraw()};
$('#eddl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contentText()],{type:'text/javascript'}));a.download='content.js';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);dlState=JSON.stringify(cur);bar()};
$('#edopen').onclick=()=>{try{localStorage.setItem('yc-site-draft',JSON.stringify({settings:E.clean(typeof SETTINGS==='object'?SETTINGS:{}),site:cur.site,pages:cur.pages}))}catch(e){}
  window.open(homeF()+'?draft','_blank')};
$('#edhow').onclick=()=>{$('#edhelp').hidden=!$('#edhelp').hidden};
$('#edclose').onclick=()=>{$('#edhelp').hidden=true};
$('#edreset').onclick=()=>{if(!changed()||confirm('Discard all changes and go back to the saved content.js?')){hist.push(clone(cur));cur=clone(SAVED);save();redraw();$('#edhelp').hidden=true}};

// ---------- fields ----------
const F=(key,label,val,hint='',rows=0)=>`<label class="ed-f"><span>${label}${hint?`<small>${hint}</small>`:''}</span>${rows?`<textarea data-k="${key}" rows="${rows}" spellcheck="true">${esc(val)}</textarea>`:`<input data-k="${key}" value="${esc(val)}" spellcheck="${key==='email'||/link|cv/.test(key)?'false':'true'}">`}</label>`;
const rowsFor=(t,min,max)=>Math.max(min,Math.min(max,t.split('\n').reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/62)),0)+1));
// opens a form: inside the part (profile column) or in its place (everything else); Done applies it, Cancel or Esc leaves it
// extra: more buttons at the right of the row, [label, action(values), title]; an action may return a message
function open(el,html,done,{inside=false,before=null,extra=[]}={}){
  if(form){form.el.classList.add('ed-flash');form.el.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>form&&form.el.classList.remove('ed-flash'),700);return}
  const f=document.createElement('div');f.className='ed-form';f.setAttribute('data-ed','');
  f.innerHTML=html+`<p class="ed-msg" hidden></p><div class="ed-row"><button type="button" class="eb pri" data-f="done">Done</button><button type="button" class="eb" data-f="cancel">Cancel</button><span class="sp"></span>`+
    extra.map(([t,,tt,dis],i)=>`<button type="button" class="eb${/^Remove/.test(t)?' txt':''}" data-f="${i}"${tt?` title="${tt}"`:''}${dis?' disabled':''}>${t}</button>`).join('')+`</div>`;
  if(before)before.before(f);else if(inside){[...el.children].forEach(c=>{c.style.display='none'});el.classList.remove('ed-blk');el.append(f)}else{el.style.display='none';el.after(f)}
  const val=()=>Object.fromEntries([...f.querySelectorAll('[data-k]')].map(x=>[x.dataset.k,x.value])),msg=t=>{const m=f.querySelector('.ed-msg');m.textContent=t;m.hidden=!t};
  const ok=()=>{const r=done(val());if(typeof r==='string')msg(r)};
  f.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;e.stopPropagation();
    if(b.dataset.f==='done')ok();else if(b.dataset.f==='cancel')redraw();else{const r=extra[+b.dataset.f][1](val());if(typeof r==='string')msg(r)}});
  f.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();redraw()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ok()}
    if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();ok()}});
  form={el:f};const first=f.querySelector('input,textarea');if(first){first.focus();first.setSelectionRange(first.value.length,first.value.length)}
  f.scrollIntoView({block:'nearest',behavior:'smooth'})}

function editProfile(el){const p=parseProfile(cur.site.sidebar);
  open(el,`<p class="lab">Profile</p>${F('name','Name',cur.site.name)}${F('lines','Position',p.lines.join('\n'),'one line each',2)}${F('email','Email',p.email)}${F('cv','CV link',p.cv,'address of the PDF')}`+
    `${F('links','Other links',p.links.map(l=>l.join(' | ')).join('\n'),'one per line: Label | address',2)}<p class="ed-note">The photo is photo.jpg in the folder; replace that file to change it.</p>`,
    v=>{if(!v.name.trim())return'The name cannot be empty.';commit(()=>{const n=parseProfile(cur.site.sidebar);n.lines=v.lines.split('\n');n.email=v.email.trim().replace(/^mailto:/i,'');n.cv=v.cv.trim();
      n.links=v.links.split('\n').map(splitLink).filter(x=>x[0]&&x[1]);cur.site.name=v.name.trim();cur.site.sidebar=buildProfile(n)})},{inside:true})}
function editAbout(el){const h=splitHome(cur.pages[homeF()]||'');
  open(el,`<p class="lab">About</p>${F('head','Heading',cur.site.about||'About')}${F('body','Text',h.body,'an empty line starts a new paragraph; [text](address) makes a link',rowsFor(h.body,6,22))}`,
    v=>{commit(()=>{const n=splitHome(cur.pages[homeF()]||'');n.body=v.body;cur.pages[homeF()]=joinHome(n);cur.site.about=v.head.trim()||'About'})})}
const papers=()=>parsePapers(cur.pages[resF()]||''),putPapers=m=>{cur.pages[resF()]=buildPapers(m)};
function editTitle(el){const m=papers();
  open(el,`<p class="lab">Research</p>${F('title','Heading',m.title||'Research')}`,
    v=>{if(!v.title.trim())return'The heading cannot be empty.';commit(()=>{const n=papers();n.title=v.title.trim();putPapers(n);if(cur.site.menu[1])cur.site.menu[1][0]=n.title})})}
function editList(el,k){const m=papers(),s=m.sections[k],np=s.items.filter(x=>x.note===undefined).length;
  open(el,`<p class="lab">List</p>${F('name','Name of the list',s.name,'e.g. Working Papers, Work in Progress, Publications')}`,
    v=>{if(!v.name.trim())return'A list needs a name; to delete it, press Remove list.';commit(()=>{const n=papers();n.sections[k].name=v.name.trim();putPapers(n)})},
    {extra:[['Remove list',()=>{if(np&&!confirm(`Remove the list "${s.name}" and its ${np} paper${np>1?'s':''}?`))return;commit(()=>{const n=papers();n.sections.splice(k,1);putPapers(n)})}]]})}
const paperForm=(p,lab)=>`<p class="lab">${lab}</p>${F('title','Title',p.title)}<div class="ed-two">${F('authors','Authors',p.authors,'e.g. with A. Coauthor')}${F('status','Status',p.status,'e.g. Revise and Resubmit, Journal of …',1)}</div>`+
  `${F('links','Links',p.links,'one per line: Label | address, e.g. Draft | https://…',Math.max(2,p.links.split('\n').length+1))}${F('abstract','Abstract',p.abstract,'optional; without it there is no Abstract button',rowsFor(p.abstract,3,12))}`;
const toPaper=v=>({title:v.title.trim(),authors:v.authors.trim(),status:v.status,links:v.links,abstract:v.abstract});
// the neighbouring paper in the same list (notes between papers are skipped)
const nb=(it,j,d)=>{let t=j+d;while(t>=0&&t<it.length&&(it[t].note!==undefined||!it[t].title.trim()))t+=d;return t>=0&&t<it.length?t:-1};
function editPaper(el,k,j){const it=papers().sections[k].items,p=it[j];
  // the arrows keep what is typed and move the paper one place in its list
  const mv=d=>v=>{if(!v.title.trim())return'A paper needs a title.';commit(()=>{const n=papers(),a=n.sections[k].items,t=nb(a,j,d);a[j]=toPaper(v);if(t>=0)[a[j],a[t]]=[a[t],a[j]];putPapers(n)})};
  open(el,paperForm(p,'Paper'),v=>{if(!v.title.trim())return'A paper needs a title; to delete it, press Remove paper.';commit(()=>{const n=papers();n.sections[k].items[j]=toPaper(v);putPapers(n)})},
    {extra:[['↑',mv(-1),'Move up',nb(it,j,-1)<0],['↓',mv(1),'Move down',nb(it,j,1)<0],
      ['Remove paper',()=>{if(!confirm(`Remove "${p.title}"?`))return;commit(()=>{const n=papers();n.sections[k].items.splice(j,1);putPapers(n)})}]]})}
function addPaper(btn,k){open(null,paperForm({title:'',authors:'',status:'',links:'',abstract:''},'New paper'),
  v=>{if(!v.title.trim())return'A paper needs a title.';commit(()=>{const n=papers();n.sections[k].items.push(toPaper(v));putPapers(n)})},{before:btn})}
function addList(btn){open(null,`<p class="lab">New list</p>${F('name','Name of the list','','e.g. Work in Progress, Publications')}`,
  v=>{if(!v.name.trim())return'A list needs a name.';commit(()=>{const n=papers();if(!n.title)n.title='Research';n.sections.push({name:v.name.trim(),items:[]});putPapers(n)})},{before:btn})}
function move(k,j,d){const t=nb(papers().sections[k].items,j,d);if(t<0)return;
  commit(()=>{const n=papers(),a=n.sections[k].items;[a[j],a[t]]=[a[t],a[j]];putPapers(n)})}

// ---------- marks on the page: every part can be clicked, or edited with its small Edit button ----------
function mark(el,acts,fn){el.classList.add('ed-blk');el.setAttribute('data-ed','');
  const c=document.createElement('span');c.className='ed-chip';c.setAttribute('data-ed','');
  c.innerHTML=acts.map(([a,dis])=>`<button type="button" class="eb sm" data-a="${a}"${dis?' disabled':''} title="${{'↑':'Move up','↓':'Move down'}[a]||'Edit'}">${a}</button>`).join('');
  el.append(c);el._ed=fn}
function addBtn(label,fn){const d=document.createElement('div');d.className='ed-add';d.setAttribute('data-ed','');d.innerHTML=`<button type="button" class="eb sm">${label}</button>`;
  d.firstChild.onclick=e=>{e.stopPropagation();fn(d)};return d}
function decorate(){if(!OK)return;
  const side=$('.side');if(side)mark(side,[['Edit']],()=>editProfile(side));
  const ab=$('#about');if(ab)mark(ab,[['Edit']],()=>editAbout(ab));
  const rs=document.getElementById(slug(resF())),m=papers();
  if(!rs){const t=$('.text');if(t)t.append(addBtn('Add a list of papers',d=>addList(d)));return}
  const h=rs.querySelector('h2.sec');if(h)mark(h,[['Edit']],()=>editTitle(h));
  let si=m.sections.length&&!m.sections[0].name?0:-1,ip=0;const last={};
  for(const el of [...rs.children]){if(el===h)continue;
    if(el.matches('h3.sub')){let n=si+1;while(n<m.sections.length&&!m.sections[n].name)n++;si=n;ip=0;if(si<m.sections.length){const k=si;mark(el,[['Edit']],()=>editList(el,k));last[k]=el}continue}
    if(si<0||si>=m.sections.length)continue;const it=m.sections[si].items;
    if(el.matches('.paper')){while(ip<it.length&&(it[ip].note!==undefined||!it[ip].title.trim()))ip++;if(ip>=it.length)continue;
      const k=si,j=ip,ps=it.map((x,i)=>x.note===undefined&&x.title.trim()?i:-1).filter(i=>i>=0);
      mark(el,[['Edit'],['↑',j===ps[0]],['↓',j===ps[ps.length-1]]],a=>a==='↑'||a==='↓'?move(k,j,a==='↑'?-1:1):editPaper(el,k,j));last[k]=el;ip++;continue}
    while(ip<it.length&&it[ip].note===undefined)ip++;if(ip<it.length){last[si]=el;ip++}}
  m.sections.forEach((s,k)=>{const after=last[k]||h;if(after){const k2=k,d=addBtn('Add a paper',x=>addPaper(x,k2));after.after(d)}});
  rs.append(addBtn('Add a list',d=>addList(d)));place()}
// beside the part when the window has room on its right, otherwise above its right end
function place(){document.querySelectorAll('.ed-chip').forEach(c=>{const r=c.parentNode.getBoundingClientRect();c.classList.toggle('out',innerWidth-r.right>c.offsetWidth+40)})}
addEventListener('resize',place);

// clicks: an Edit or arrow button acts; a click anywhere on a part opens it (links do not leave the editor; the Abstract button still opens)
document.addEventListener('click',e=>{if(e.target.closest('.ed-form,#edbar,#edhelp,.ed-add'))return;
  const b=e.target.closest('.ed-chip button');if(b){e.preventDefault();e.stopPropagation();if(!b.disabled)b.closest('.ed-blk')._ed(b.dataset.a);return}
  const a=e.target.closest('#page a');if(a)e.preventDefault();
  if(e.target.closest('.abs-btn'))return;
  const blk=e.target.closest('.ed-blk');if(blk&&!(getSelection()+'').trim())blk._ed('Edit')},true);
document.addEventListener('keydown',e=>{if(!form&&(e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.target.closest('input,textarea')){e.preventDefault();$('#edundo').click()}});

// the page starts below the top bar, whose height grows when it wraps on a phone
const fitBar=()=>document.documentElement.style.setProperty('--eh',$('#edbar').offsetHeight+'px');
addEventListener('resize',fitBar);fitBar();
addEventListener('DOMContentLoaded',()=>{redraw();fitBar()});
if(document.readyState!=='loading')redraw();
window.siteEditor={get cur(){return cur},contentText,changed};   // for checks from the browser console
})();
</script>
</body></html>
